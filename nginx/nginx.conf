worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    # Define rate limiting zone
    limit_req_zone $binary_remote_addr zone=limit_zone:10m rate=10r/s;

    upstream backend {
        least_conn;
        server server1:4000 max_fails=3 fail_timeout=5s;
        server server2:4001 max_fails=3 fail_timeout=5s;
        server server3:4002 max_fails=3 fail_timeout=5s;
    }

    log_format json_format '{'
    '"time_local": "$time_local", '
    '"remote_addr": "$remote_addr", '
    '"x_forwarded_for": "$http_x_forwarded_for", '
    '"client_ip": "$http_x_forwarded_for", '
    '"request": "$request", '
    '"status": $status, '
    '"body_bytes_sent": $body_bytes_sent, '
    '"request_time": $request_time, '
    '"upstream_addr": "$upstream_addr", '
    '"upstream_response_time": "$upstream_response_time"'
    '}';


    server {
        listen 443 ssl;
        server_name localhost;

        access_log /var/log/nginx/access.log json_format;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx-self.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx-self.key;

        # Security Enhancements
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=limit_zone burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1800;
            proxy_connect_timeout 1800;
        }
    }

    # HTTP Server Block (local/dev friendly — no TLS required)
    server {
        listen 8080;
        server_name localhost;

        access_log /var/log/nginx/access.log json_format;

        location / {
            limit_req zone=limit_zone burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1800;
            proxy_connect_timeout 1800;
        }
    }
}